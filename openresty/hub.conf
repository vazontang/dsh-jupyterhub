# OpenResty / nginx in front of JupyterHub (k3s NodePort 30080 on the same VM).
# Put in /etc/openresty/conf.d/ (or /etc/nginx/conf.d/) and set server_name + certs.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# DSH sets its session cookie with Path=/. Scope it to the user's own DSH prefix
# so it is not sent to the Hub or other paths, and two users' DSH cookies on the
# same host never collide (e.g. an admin opening several servers).
map $uri $dsh_cookie_path {
    "~^(?<p>/user/[^/]+/dsh/)" $p;
    default                    "/";
}

upstream jupyterhub {
    server 127.0.0.1:30080;   # proxy-public NodePort
    keepalive 32;
}

server {
    listen 80;
    server_name jhub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jhub.example.com;

    ssl_certificate     /etc/ssl/jhub/fullchain.pem;
    ssl_certificate_key /etc/ssl/jhub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512m;          # notebook / file uploads
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://jupyterhub;
        proxy_http_version 1.1;

        # Keep the public Host: DSH's Host/Origin fence and cookie audience use it.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme          $scheme;

        # WebSockets: Jupyter kernels/terminals, DSH /api/remote.mux
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;            # streaming model output

        # only an exact "Path=/" is rewritten; Jupyter's own cookie paths are untouched
        proxy_cookie_path ~^/$ $dsh_cookie_path;
        # DSH listens on plain HTTP behind the proxy, so its cookie lacks Secure
        proxy_cookie_flags ~^dsh-auth- secure;
    }
}
